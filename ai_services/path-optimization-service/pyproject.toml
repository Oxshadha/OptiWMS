[project]
name = "path-optimization-service"
version = "0.1.0"
description = "A* pathfinding service for warehouse picking and putaway optimization"
authors = [{name = "OptiWMS Team"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.0.0"
numpy = "^1.24.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
