[project]
name = "forecast-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pandas==2.3.3",
  "numpy==2.5.1",
  "statsmodels==0.14.6",
  "lightgbm==4.7.0",
  "scikit-learn==1.9.0",
  "shap>=0.48",
]

[project.optional-dependencies]
legacy-boosting = [
  "xgboost>=2.0",
  "catboost>=1.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["artifacts*", "scripts*", "tests*"]
