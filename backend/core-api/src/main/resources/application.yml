server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: jdbc:postgresql://localhost:5434/optiwms
    username: optiwms
    password: optiwms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO

optiwms:
  seed:
    racks: false

# -----------------------------------------------------------------------------
# DEVELOPMENT DEFAULTS
# -----------------------------------------------------------------------------
# This file is used mainly for local development.
# For production, use profile-specific overrides (for example docker/prod):
# - Disable default admin/dev seeding
# - Use strong secrets and non-default DB credentials
# - Restrict CORS to real frontend domains only
# -----------------------------------------------------------------------------


ai:
  services:
    forecast-base-url: http://localhost:8091
    orchestrator-base-url: http://localhost:8092
    auth-token: ""
  monitoring:
    enabled: false
    fixed-delay-ms: 300000
    limit: 200
