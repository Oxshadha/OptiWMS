server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: jdbc:postgresql://127.0.0.1:5435/optiwms?connectTimeout=30&socketTimeout=30
    #url: jdbc:postgresql://127.0.0.1:5434/optiwms
    #url: jdbc:postgresql://localhost:5434/optiwms
    username: optiwms
    password: optiwms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO


