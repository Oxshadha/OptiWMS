server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: jdbc:postgresql://localhost:5434/optiwms
    username: optiwms
    password: optiwms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO

optiwms:
  seed:
    default-admin:
      # DEV defaults for easy local login:
      # username=admin, email=admin@optiwms.com, password=admin123
      # PRODUCTION: set SEED_DEFAULT_ADMIN=false and provide no default password.
      enabled: ${SEED_DEFAULT_ADMIN:true}
      username: ${SEED_DEFAULT_ADMIN_USERNAME:admin}
      email: ${SEED_DEFAULT_ADMIN_EMAIL:admin@optiwms.com}
      password: ${SEED_DEFAULT_ADMIN_PASSWORD:admin123}
