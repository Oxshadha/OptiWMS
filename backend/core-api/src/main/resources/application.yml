server:
  port: 8080

spring:
  application:
    name: optiwms-core
  datasource:
    url: jdbc:postgresql://localhost:5434/optiwms
    username: optiwms
    password: optiwms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO


