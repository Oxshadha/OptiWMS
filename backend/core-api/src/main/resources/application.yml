server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: jdbc:postgresql://localhost:5434/optiwms
    username: optiwms
    password: optiwms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQL17Dialect
        jdbc:
          batch_size: 20
          fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    placeholders:
      skip_bad_migrations: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO

optiwms:
  seed:
    racks: false

# -----------------------------------------------------------------------------
# DEVELOPMENT DEFAULTS
# -----------------------------------------------------------------------------
# This file is used mainly for local development.
# For production, use profile-specific overrides (for example docker/prod):
# - Disable default admin/dev seeding
# - Use strong secrets and non-default DB credentials
# - Restrict CORS to real frontend domains only
# -----------------------------------------------------------------------------


ai:
  http:
    connect-timeout-seconds: 3
    read-timeout-seconds: 300
  services:
    forecast-base-url: http://localhost:8091
    orchestrator-base-url: http://localhost:8092
    slotting-base-url: http://localhost:8093
    slotting-enabled: false
    auth-token: ${AI_SERVICES_AUTH_TOKEN:}
  monitoring:
    enabled: false
    fixed-delay-ms: 300000
    limit: 200
    trigger-block-on-critical: true
    trigger-guard-window: 200
    allow-critical-override: true
    trigger-fail-open-on-guard-error: true
