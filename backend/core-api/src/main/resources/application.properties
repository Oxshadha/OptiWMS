# OptiWMS Backend Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/
# Remove server header for security
server.server-header=

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5434/optiwms
spring.datasource.username=optiwms
spring.datasource.password=optiwms
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (Production-Ready)
# HikariCP is the default connection pool in Spring Boot (fastest, most reliable)
spring.datasource.hikari.maximum-pool-size=10
# Maximum number of connections in the pool (default: 10)
# Calculation: (core_count * 2) + effective_spindle_count
# For 4-core CPU + SSD: (4 * 2) + 1 = 9-10 connections

spring.datasource.hikari.minimum-idle=5
# Minimum idle connections (default: same as maximum-pool-size)
# Keep 5 connections ready for immediate use

spring.datasource.hikari.connection-timeout=30000
# Max time (ms) to wait for connection from pool (default: 30000 = 30 seconds)
# If all connections busy, wait max 30s before throwing exception

spring.datasource.hikari.idle-timeout=600000
# Max time (ms) a connection can sit idle (default: 600000 = 10 minutes)
# Idle connections beyond minimum-idle will be closed after 10 minutes

spring.datasource.hikari.max-lifetime=1800000
# Max lifetime (ms) of a connection (default: 1800000 = 30 minutes)
# Prevents stale connections, forces refresh every 30 minutes

spring.datasource.hikari.connection-test-query=SELECT 1
# Query to test if connection is alive (PostgreSQL: SELECT 1)
# Ensures connections are valid before use

spring.datasource.hikari.pool-name=OptiWMS-HikariPool
# Name for the connection pool (for monitoring/logging)

spring.datasource.hikari.auto-commit=true
# Auto-commit transactions (default: true)
# Set to false if you want manual transaction control

spring.datasource.hikari.leak-detection-threshold=60000
# Detect connection leaks after 60 seconds (default: 0 = disabled)
# Logs warning if connection not returned to pool within 60s

# JPA/Hibernate Configuration
# Use Flyway as the source of truth for schema changes.
# Hibernate should validate mappings against the migrated schema, not mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Validate migration history on startup so schema drift is caught early.
spring.flyway.validate-on-migrate=true
# Keep repair disabled by default; manual repair should be a deliberate operator action.
spring.flyway.repair-on-migrate=false

# JWT Configuration
# IMPORTANT: Change this in production! Generate with: openssl rand -base64 64

# Use environment variable: export JWT_SECRET=$(openssl rand -base64 64)
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_GENERATE_WITH_openssl_rand_base64_64}
jwt.accessTokenExpirationMs=900000
# Access token: 15 minutes (900,000 ms)
jwt.refreshTokenExpirationMs=604800000
# Refresh token: 7 days (604,800,000 ms)

# CORS Configuration (Environment-specific)
frontend.url=${FRONTEND_URL:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}

# Logging Configuration
logging.level.root=INFO
logging.level.com.optiwms=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Jackson Configuration (JSON serialization)
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Colombo

# Actuator Configuration (Health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security
# Change this in production!
# Generate secure secret: openssl rand -base64 64
# DEV ONLY: do not use default credentials in production.
# In production, disable fallback credentials and use identity provider / secure secrets.
spring.security.user.name=admin
spring.security.user.password=admin123

# Application-specific Configuration
optiwms.rate-limit.max-attempts=5
optiwms.rate-limit.window-minutes=1
optiwms.ai-service.timeout-seconds=2
optiwms.ai-service.enabled=false
optiwms.synthetic-data.enabled=false
optiwms.seed.racks=false

# AI proxy HTTP timeouts (core-api -> forecast/orchestrator services)
ai.http.connect-timeout-seconds=3
ai.http.read-timeout-seconds=300

# Environment (development, staging, production)
environment=${ENVIRONMENT:development}

# -----------------------------------------------------------------------------
# PRODUCTION CHECKLIST (CONFIG)
# -----------------------------------------------------------------------------
# 1) Set ENVIRONMENT=production
# 2) Set JWT_SECRET via secure environment variable (no fallback literals)
# 3) Replace datasource defaults with production secrets
# 4) Ensure default admin/dev seeding is disabled in production profile
# 5) Restrict FRONTEND_URL to actual production domain(s)
# -----------------------------------------------------------------------------
