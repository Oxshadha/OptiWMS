server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/optiwms}
    username: ${SPRING_DATASOURCE_USERNAME:optiwms}
    password: ${SPRING_DATASOURCE_PASSWORD:optiwms}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO

ai:
  http:
    connect-timeout-seconds: 3
    read-timeout-seconds: 300
  services:
    forecast-base-url: ${AI_FORECAST_BASE_URL:http://forecast-service:8091}
    orchestrator-base-url: ${AI_ORCHESTRATOR_BASE_URL:http://orchestrator-service:8092}
    auth-token: ${AI_SERVICES_AUTH_TOKEN:}
  monitoring:
    enabled: false
    fixed-delay-ms: 300000
    limit: 200
    trigger-block-on-critical: false
    trigger-guard-window: 200
    allow-critical-override: false
    trigger-fail-open-on-guard-error: true

# -----------------------------------------------------------------------------
# PRODUCTION NOTES
# -----------------------------------------------------------------------------
# 1) This docker profile is intended for deployment-like environments.
# 2) Default admin/dev credentials must never be used in production.
# 3) Keep default-admin seeding disabled in production environments.
#    (If you add a seeding toggle property, ensure it resolves to false here.)
# 4) Use secret manager / environment variables for all sensitive values:
#    - JWT_SECRET
#    - DB credentials
# -----------------------------------------------------------------------------
