server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/optiwms}
    username: ${SPRING_DATASOURCE_USERNAME:optiwms}
    password: ${SPRING_DATASOURCE_PASSWORD:optiwms}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO

optiwms:
  seed:
    default-admin:
      # Keep disabled in container/prod by default.
      # If you must enable temporarily, pass these env vars explicitly:
      # SEED_DEFAULT_ADMIN=true
      # SEED_DEFAULT_ADMIN_USERNAME=<secure-username>
      # SEED_DEFAULT_ADMIN_EMAIL=<secure-email>
      # SEED_DEFAULT_ADMIN_PASSWORD=<strong-password>
      enabled: ${SEED_DEFAULT_ADMIN:false}
      username: ${SEED_DEFAULT_ADMIN_USERNAME:}
      email: ${SEED_DEFAULT_ADMIN_EMAIL:}
      password: ${SEED_DEFAULT_ADMIN_PASSWORD:}
