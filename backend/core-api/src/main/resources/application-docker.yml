server:
  port: 8080
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"

spring:
  application:
    name: optiwms-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/optiwms}
    username: ${SPRING_DATASOURCE_USERNAME:optiwms}
    password: ${SPRING_DATASOURCE_PASSWORD:optiwms}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework.security: INFO

