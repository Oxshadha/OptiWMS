[project]
name = "forecast-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "xgboost>=2.0",
  "catboost>=1.2",
  "lightgbm>=4.0",
  "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
