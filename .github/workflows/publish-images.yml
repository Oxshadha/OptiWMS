name: Publish versioned OptiWMS images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/verify_forecast_artifact_contract.py

  publish:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: forecast
            context: .
            file: ai_services/forecast-service/Dockerfile
          - name: slotting
            context: ai_services/slotting-service
            file: ai_services/slotting-service/Dockerfile
          - name: orchestrator
            context: ai_services/orchestrator-service
            file: ai_services/orchestrator-service/Dockerfile
          - name: assistant
            context: ai_services/ai-agent
            file: ai_services/ai-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/optiwms-${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=edge,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WAREHOUSE_AI_URL=/agent/ask
            NEXT_PUBLIC_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
