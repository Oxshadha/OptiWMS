name: AI Inference Gate

on:
  pull_request:
    paths:
      - "ai-services/**"
      - "backend/**"
      - ".github/workflows/ai-inference-gate.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "ai-services/**"
      - "backend/**"

jobs:
  forecast-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-services/forecast-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install forecast-service deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run forecast-service inference tests
        run: |
          pytest -q tests/test_artifacts_online_route.py tests/test_artifact_service_fallback.py

  core-api-ai-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run core-api AI proxy tests
        run: |
          ./gradlew :core-api:test --tests "com.optiwms.coreapi.ai.AiProxyControllerTest" --tests "com.optiwms.coreapi.ai.AiProxyServiceTest"
